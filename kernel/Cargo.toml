[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/javidmardanov/VoynichAtHome"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: exact float parsing, so content digests survive a JSON round trip.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = { version = "0.10", default-features = false }
libm = "0.2"
rand_chacha = { version = "0.3", default-features = false }
rand_core = { version = "0.6", default-features = false }

# Release profile is shared by the native CLI and the wasm32 module.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false

# Tests run the full bootstrap on the real corpus; optimise them. Results do
# not depend on the optimisation level (the golden tests check exactly that).
[profile.test]
opt-level = 2
