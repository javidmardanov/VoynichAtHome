name: contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Validate contracts
        run: |
          vah validate corpus-snapshot examples/corpus-snapshot.synthetic.json
          vah validate experiment examples/experiment.known-cipher.json
          vah verify-work-unit examples/work-unit.known-cipher.000000.json
          vah verify-bundle examples/bundle.synthetic.json
      - name: Test
        run: pytest
