name: Signed release candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing owner-approved version tag, with docs/releases/TAG.md
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Require a version tag and reviewed release notes
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test -f "docs/releases/$RELEASE_TAG.md"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npx --yes npm@11.19.1 ci
      - name: Build and check pinned Rust
        working-directory: kernel
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo build --locked --release -p vah-search -p vah-search-wasm --bins
      - name: Build bounded WebAssembly
        working-directory: kernel
        env:
          RUSTFLAGS: '-C link-arg=--max-memory=100663296'
        run: cargo build --locked --release --target wasm32-unknown-unknown -p vah-search-wasm --lib
      - run: npm run kernel:package --workspace platform
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=low
      - run: npm run build
      - run: npm run package:worker --workspace platform
      - run: npm run package:cli --workspace platform
      - name: Browser acceptance checks
        if: runner.os == 'Linux'
        working-directory: platform
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npx playwright test
          npm run test:load
      - name: Package the native tools and their license notices
        shell: bash
        run: |
          mkdir -p release-assets
          tar -czf "release-assets/voynich-cli-$RUNNER_OS-$RUNNER_ARCH.tar.gz" -C platform/dist/cli .
          node .github/scripts/checksums.mjs release-assets
      - name: Sign build provenance with GitHub OIDC
        id: attest
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: release-assets/*.tar.gz
      - name: Preserve the verification bundle
        shell: bash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "release-assets/voynich-cli-$RUNNER_OS-$RUNNER_ARCH.sigstore.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: release-assets/
          retention-days: 30
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Create a draft for the human release authority
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --title "Voynich@home $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" release-assets/*
