[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "voynich-at-home-contracts"
version = "0.1.0"
description = "Executable data contracts for the Voynich@Home research blueprint"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema[format]>=4.23,<5",
  "rfc8785>=0.1.4,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
vah = "voynich_at_home.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voynich_at_home"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
